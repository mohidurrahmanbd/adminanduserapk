      npm install
      npm install @capacitor/cli @capacitor/android

  - name: Build Admin
    run: npm run build:admin

  - name: Inspect Admin Output
    run: |
      echo "===== DIST-ADMIN ====="
      find dist-admin -type f | sort || true

  - name: Ensure Admin index.html Exists
    run: |
      if [ -f dist-admin/index-admin.html ]; then
        cp dist-admin/index-admin.html dist-admin/index.html
      fi

      if [ ! -f dist-admin/index.html ]; then
        echo "ERROR: dist-admin/index.html not found"
        exit 1
      fi

  - name: Create Admin Capacitor Config
    run: |
      cat > capacitor.config.ts << 'EOF'
      import type { CapacitorConfig } from '@capacitor/cli';

      const config: CapacitorConfig = {
