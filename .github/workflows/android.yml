      export default config;
      EOF

  - name: Generate Android Project
    run: |
      npx cap add android || true
      npx cap sync android

  - name: Build Admin APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload Admin APK
    uses: actions/upload-artifact@v4
