name: Build Admin & User APKs

on:
workflow_dispatch:

jobs:
build-user:
name: Build User APK
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - name: Install Dependencies
    run: |
      npm install
      npm install @capacitor/cli @capacitor/android

  - name: Build Mobile
    run: npm run build:mobile

  - name: Inspect Mobile Output
    run: |
      echo "===== DIST-MOBILE ====="
      find dist-mobile -type f | sort || true

  - name: Ensure Mobile index.html Exists
    run: |
      if [ -f dist-mobile/index-mobile.html ]; then
        cp dist-mobile/index-mobile.html dist-mobile/index.html
      fi

      if [ ! -f dist-mobile/index.html ]; then
        echo "ERROR: dist-mobile/index.html not found"
        exit 1
      fi

  - name: Create User Capacitor Config
    run: |
      cat > capacitor.config.ts << 'EOF'
      import type { CapacitorConfig } from '@capacitor/cli';

      const config: CapacitorConfig = {
        appId: 'com.orjonmcq.app',
        appName: 'Orjon MCQ',
        webDir: 'dist-mobile',
        server: {
          androidScheme: 'https'
        }
      };

      export default config;
      EOF

  - name: Generate Android Project
    run: |
      npx cap add android || true
      npx cap sync android

  - name: Build User APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload User APK
    uses: actions/upload-artifact@v4
    with:
      name: Orjon-User-Debug-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk

build-admin:
name: Build Admin APK
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
